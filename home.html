<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Image Authenticity Checker</title>

  <style>
    /* ---------- Base ---------- */
    :root {
      --bg: #0b1220;
      --surface: #111b2e;
      --surface-light: #17243a;
      --border: #263750;
      --text: #f5f7fb;
      --muted: #9aa8bd;
      --accent: #4f8cff;
      --accent-hover: #3d7df0;
      --success: #22c55e;
      --danger: #ef4444;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;

      background:
        radial-gradient(
          circle at top,
          rgba(79, 140, 255, 0.12),
          transparent 38%
        ),
        var(--bg);

      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    /* ---------- Main card ---------- */
    .app {
      width: min(100%, 720px);
      padding: 36px;

      background: rgba(17, 27, 46, 0.96);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 6px 12px;
      margin-bottom: 14px;

      border: 1px solid rgba(79, 140, 255, 0.3);
      border-radius: 999px;

      background: rgba(79, 140, 255, 0.08);
      color: #8eb5ff;

      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    h1 {
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
    }

    .subtitle {
      max-width: 520px;
      margin: 0 auto;

      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ---------- Upload area ---------- */
    .upload-area {
      position: relative;
      overflow: hidden;

      min-height: 360px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px dashed #3a4c68;
      border-radius: 16px;

      background: #0d1728;

      transition:
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .upload-area:hover {
      border-color: #54729e;
      background: #0f1b2e;
    }

    .upload-area.has-image {
      border-style: solid;
      padding: 12px;
    }

    #imageInput {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .upload-prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .upload-icon {
      width: 64px;
      height: 64px;

      display: grid;
      place-items: center;

      margin-bottom: 18px;

      border-radius: 16px;
      background: rgba(79, 140, 255, 0.1);
      color: #75a5ff;

      font-size: 28px;
    }

    .upload-prompt h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .upload-prompt p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .browse-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 44px;
      padding: 0 20px;

      border: 1px solid #3b65a5;
      border-radius: 10px;

      background: rgba(79, 140, 255, 0.12);
      color: #a9c6ff;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
      transition: all 0.2s ease;
    }

    .browse-button:hover {
      background: rgba(79, 140, 255, 0.2);
      border-color: #5e8fe5;
    }

    .browse-button:focus-visible {
      outline: 3px solid rgba(79, 140, 255, 0.35);
      outline-offset: 3px;
    }

    /* ---------- Image preview ---------- */
    .preview-wrapper {
      display: none;
      width: 100%;
      height: 100%;
      min-height: 330px;

      align-items: center;
      justify-content: center;
    }

    .preview-wrapper.visible {
      display: flex;
    }

    #imagePreview {
      display: block;

      max-width: 100%;
      max-height: 500px;
      width: auto;
      height: auto;

      border-radius: 10px;
      object-fit: contain;
    }

    /* ---------- Check button ---------- */
    .check-button {
      width: 100%;
      height: 54px;

      margin-top: 18px;

      border: none;
      border-radius: 11px;

      background: var(--accent);
      color: white;

      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.08em;

      cursor: pointer;

      box-shadow: 0 8px 20px rgba(79, 140, 255, 0.18);

      transition:
        background 0.2s ease,
        transform 0.15s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
    }

    .check-button:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(79, 140, 255, 0.25);
    }

    .check-button:active:not(:disabled) {
      transform: translateY(0);
    }

    .check-button:focus-visible {
      outline: 3px solid rgba(79, 140, 255, 0.35);
      outline-offset: 3px;
    }

    .check-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ---------- Result ---------- */
    .result {
      margin-top: 26px;
      padding: 22px;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: var(--surface-light);
      text-align: center;
    }

    .result-label {
      margin-bottom: 8px;

      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .result-value {
      font-size: clamp(26px, 6vw, 36px);
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .result-value.placeholder {
      color: var(--muted);
    }

    .result-value.real {
      color: var(--success);
    }

    .result-value.fake {
      color: var(--danger);
    }

    .result-description {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    /* ---------- Footer ---------- */
    .footer {
      margin-top: 22px;

      text-align: center;
      color: #718199;
      font-size: 12px;
      line-height: 1.5;
    }

    /* ---------- Mobile ---------- */
    @media (max-width: 600px) {
      body {
        padding: 16px 12px;
        align-items: flex-start;
      }

      .app {
        padding: 24px 18px;
        margin-top: 10px;
      }

      .header {
        margin-bottom: 24px;
      }

      .upload-area {
        min-height: 300px;
      }

      .preview-wrapper {
        min-height: 270px;
      }

      #imagePreview {
        max-height: 420px;
      }

      .check-button {
        height: 52px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- Header -->
    <header class="header">
      <div class="badge">
        <span class="badge-dot"></span>
        Image Analysis
      </div>

      <h1>Image Authenticity Checker</h1>

      <p class="subtitle">
        Upload an image to preview it before checking whether it is
        authentic or AI-generated.
      </p>
    </header>


    <!-- Upload / Preview -->
    <section
      class="upload-area"
      id="uploadArea"
      aria-label="Image upload area"
    >

      <!-- Initial upload state -->
      <div class="upload-prompt" id="uploadPrompt">

        <div class="upload-icon" aria-hidden="true">
          ↑
        </div>

        <h2>Select an image</h2>

        <p>
          JPG, JPEG, PNG or WEBP
        </p>

        <label
          for="imageInput"
          class="browse-button"
        >
          Choose Image
        </label>

      </div>


      <!-- Image preview state -->
      <div
        class="preview-wrapper"
        id="previewWrapper"
      >
        <img
          id="imagePreview"
          src=""
          alt="Selected image preview"
        />
      </div>

    </section>


    <!-- Hidden file input -->
    <input
      id="imageInput"
      type="file"
      accept="image/jpeg,image/png,image/webp"
    />


    <!-- Check button -->
    <button
      id="checkButton"
      class="check-button"
      type="button"
      disabled
    >
      CHECK
    </button>


    <!-- Result -->
    <section
      class="result"
      aria-live="polite"
      aria-label="Image authenticity result"
    >
      <div class="result-label">
        Prediction
      </div>

      <div
        id="resultValue"
        class="result-value placeholder"
      >
        —
      </div>

      <p
        id="resultDescription"
        class="result-description"
      >
        Upload an image to begin.
      </p>
    </section>


    <p class="footer">
      Front-end demonstration only. No image is uploaded or analyzed
      by a server.
    </p>

  </main>


  <script>
    const imageInput = document.getElementById("imageInput");
    const uploadArea = document.getElementById("uploadArea");
    const uploadPrompt = document.getElementById("uploadPrompt");
    const previewWrapper = document.getElementById("previewWrapper");
    const imagePreview = document.getElementById("imagePreview");
    const checkButton = document.getElementById("checkButton");

    const resultValue = document.getElementById("resultValue");
    const resultDescription =
      document.getElementById("resultDescription");


    /*
     * Handle image selection.
     * The selected file is converted into a local object URL
     * so it can be previewed without uploading it anywhere.
     */
    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];

      if (!file) {
        resetInterface();
        return;
      }

      if (!file.type.startsWith("image/")) {
        resetInterface();
        return;
      }

      const imageUrl = URL.createObjectURL(file);

      imagePreview.src = imageUrl;

      uploadPrompt.style.display = "none";
      previewWrapper.classList.add("visible");
      uploadArea.classList.add("has-image");

      checkButton.disabled = false;

      // Reset previous result when a new image is selected.
      resultValue.textContent = "—";
      resultValue.className = "result-value placeholder";

      resultDescription.textContent =
        "Ready for analysis.";
    });


    /*
     * Demonstration-only CHECK interaction.
     * Replace this section later with the actual model/API call.
     */
    checkButton.addEventListener("click", () => {
      if (!imageInput.files.length) return;

      resultValue.textContent = "REAL";
      resultValue.className = "result-value real";

      resultDescription.textContent =
        "Sample prediction — connect your detection model here.";
    });


    /*
     * Allow clicking the upload area to select another image.
     * Avoid triggering the file picker when clicking the preview itself.
     */
    uploadArea.addEventListener("click", (event) => {
      if (
        event.target === imagePreview ||
        event.target.closest(".browse-button")
      ) {
        return;
      }

      imageInput.click();
    });


    function resetInterface() {
      imageInput.value = "";
      imagePreview.removeAttribute("src");

      uploadPrompt.style.display = "flex";
      previewWrapper.classList.remove("visible");
      uploadArea.classList.remove("has-image");

      checkButton.disabled = true;

      resultValue.textContent = "—";
      resultValue.className = "result-value placeholder";

      resultDescription.textContent =
        "Upload an image to begin.";
    }
  </script>

</body>
</html>
